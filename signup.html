<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KaamKaro AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(23, 78, 166, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #174ea6;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.1);
        }

        .signup-btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #174ea6;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #123b7a;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #174ea6;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .contact-info {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        .contact-info p {
            margin: 8px 0;
            color: #475569;
            font-size: 14px;
        }

        .contact-info a {
            color: #174ea6;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">KaamKaro AI</div>

        <p class="subtitle">Create your account</p>

        <form onsubmit="createAccount(event)">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="contact-info">

            <p>
                📧
                <a href="mailto:kaamkaroai@gmail.com">
                    kaamkaroai@gmail.com
                </a>
            </p>

            <p>
                📸
                <a
                    href="https://instagram.com/kaamkaroai"
                    target="_blank"
                >
                    @kaamkaroai
                </a>
            </p>

        </div>

        <a href="home.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script>
       
function createAccount(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    const user = {
        name: name,
        email: email,
        password: password
    };

    localStorage.setItem("kaamkaroUser", JSON.stringify(user));

    alert("Account created successfully!");

    window.location.href = "login.html";
}

    </script>

</body>
</html>
